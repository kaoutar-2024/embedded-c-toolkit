name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: make test CC=${{ matrix.cc }}
      - name: Run tests with AddressSanitizer and UBSan
        run: make sanitize CC=${{ matrix.cc }}
